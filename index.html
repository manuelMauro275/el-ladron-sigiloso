function buildMap(){

  h+=`<button class="lv ${lock?'lock':''} ${cur?'cur':''}" data-i="${i}" style="left:${x}%;top:${y}%;animation-delay:${.15*i}s"><span class="n">${lock?'🔒':i+1}</span><span class="nm">${l.name}</span><span class="s">${'★'.repeat(save.stars[i])}${'☆'.repeat(5-save.stars[i])}</span></button>`});
 $('grid').innerHTML=h;$('tot').textContent=t;
 document.querySelectorAll('.lv:not(.lock)').forEach(b=>b.onclick=()=>start(+b.dataset.i));
}

function drawDiamond(x,y,s,col){ctx.fillStyle=col||'#7fe6ff';ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-s,y-s*.35);ctx.lineTo(x-s*.55,y-s);ctx.lineTo(x+s*.55,y-s);ctx.lineTo(x+s,y-s*.35);ctx.lineTo(x,y+s);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.moveTo(x-s*.55,y-s);ctx.lineTo(x,y-s*.35);ctx.lineTo(x-s,y-s*.35);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.moveTo(x,y-s*.35);ctx.lineTo(x+s*.55,y-s);ctx.lineTo(x+s,y-s*.35);ctx.fill()}
function drawGate(){const e=L.start,y=FY[e.f],x=e.x;
 ctx.fillStyle='#000';ctx.fillRect(x-28,y-98,56,98);
 ctx.fillStyle=hasGem?'#ff4fb0':'#5a5a66';ctx.fillRect(x-24,y-94,48,94);
 ctx.fillStyle=hasGem?'#ffc2ea':'#7a7a86';ctx.fillRect(x-17,y-86,34,38);
 ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText(hasGem?'SALIDA':'ENTRADA',x,y-103);
 if(!hasGem){ctx.fillStyle='#ddd';ctx.fillRect(x-7,y-30,14,12);ctx.strokeStyle='#ddd';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y-30,5,Math.PI,0);ctx.stroke()}
 else{const bo=Math.sin(time*6)*5;ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-11,y-138+bo);ctx.lineTo(x+11,y-138+bo);ctx.lineTo(x,y-120+bo);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#ffd21f';ctx.font='bold 14px sans-serif';ctx.fillText('¡ESCAPA!',x,y-146+bo)}}
function drawVault(){const v=vault,y=FY[v.f],x=v.x;
 ctx.fillStyle='#000';ctx.fillRect(x-28,y-34,56,34);ctx.fillStyle='#3a3a44';ctx.fillRect(x-26,y-32,52,32);ctx.fillStyle='#5a5a66';ctx.fillRect(x-26,y-32,52,5);
 ctx.fillStyle='rgba(170,225,255,.3)';ctx.fillRect(x-22,y-84,44,52);ctx.strokeStyle='#9fd8ff';ctx.lineWidth=2;ctx.strokeRect(x-22,y-84,44,52);
 if(!v.open){drawDiamond(x,y-58+Math.sin(time*2)*2,13);const k=(time*1.5)%1;ctx.fillStyle='rgba(255,255,255,'+(1-k)+')';ctx.fillRect(x+6-k*10,y-68-k*8,3,3);ctx.fillRect(x-12+k*6,y-52,2,2)}
 ctx.fillStyle='#111';ctx.fillRect(x-9,y-26,18,16);ctx.fillStyle=v.open?'#4f6':'#f33';ctx.fillRect(x-6,y-23,12,4);ctx.fillStyle='#888';for(let i=0;i<3;i++)ctx.fillRect(x-6+i*5,y-17,3,3);
 if(!v.open&&v.f===p.f&&Math.abs(p.x-v.x)<36)bub(x,y-96,'W / ↑ abrir vitrina')}
function drawLoot(){for(const q of loot){if(q.got)continue;const y=FY[q.f]-26+Math.sin(time*3+q.x)*3,s=Math.abs(Math.cos(time*3+q.x));
 if(q.k==='coin'){ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(q.x,y,8*s+4,10,0,0,7);ctx.fill();ctx.fillStyle='#ffd21f';ctx.beginPath();ctx.ellipse(q.x,y,6*s+2,8,0,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillRect(q.x-1,y-5,2,4)}
 else if(q.k==='ring'){ctx.strokeStyle='#000';ctx.lineWidth=7;ctx.beginPath();ctx.arc(q.x,y+3,8,0,7);ctx.stroke();ctx.strokeStyle='#ffd21f';ctx.lineWidth=4;ctx.stroke();drawDiamond(q.x,y-8,6,'#ff7ac8')}
 else{ctx.fillStyle='#000';ctx.fillRect(q.x-15,y-9,30,20);ctx.fillStyle='#4caf50';ctx.fillRect(q.x-13,y-7,26,16);ctx.fillStyle='#2e7d32';ctx.fillRect(q.x-13,y-1,26,4);ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('$',q.x,y+7)}}}
function toast(t,ms){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.style.opacity=0},ms||4000)}
function closePz(){puz=false;pzSt=null;const b=$('pz');if(b)b.style.display='none'}
function openPuzzle(){const st=vault.stages[vault.stage];puz=true;
 pzSt={st,in:[],wrong:0,show:false,d:st.t==='code'?Array(st.n).fill(0):[],seq:st.t==='memory'?Array.from({length:st.len},()=>Math.floor(Math.random()*4)):[]};renderPz()}
function renderPz(){const st=pzSt.st;
 const nh=notes.length?'<div class="pn"><b>📝 Notas encontradas:</b><br>'+notes.map(n=>'• '+n).join('<br>')+'</div>':'<div class="pn">📝 Aún no has leído ninguna nota. ¡Busca documentos por el edificio!</div>';
 let h=`<div class="pbox"><h2>🔐 ${st.title||'Vitrina'} <small>(${vault.stage+1}/${vault.stages.length})</small></h2>`;
 if(st.t==='code')h+=`<div class="dials">${pzSt.d.map((v,i)=>`<div><button data-a="u" data-i="${i}">▲</button><span>${v}</span><button data-a="d" data-i="${i}">▼</button></div>`).join('')}</div><p>Ajusta los ${st.n} dígitos y prueba el código.</p><button class="btn" data-a="ok">Probar</button>`;
 else h+=`<div class="pads">${COLS.map((c,i)=>`<button class="pad" id="pad${i}" data-a="p" data-i="${i}" style="background:${c}">${NM[i]}</button>`).join('')}</div><p id="pzHint">${st.t==='order'?'Pulsa las palancas en el orden correcto (revisa tus notas).':'Memoriza la secuencia…'}</p><div id="pzProg"></div>`;
 h+=`<div id="pzMsg"></div>${nh}<button class="btn" data-a="x">Salir</button></div>`;
 const b=$('pz');b.innerHTML=h;b.style.display='flex';if(st.t==='memory')playSeq()}
function flashPad(i){const e=$('pad'+i);if(!e)return;e.classList.add('lit');setTimeout(()=>e.classList.remove('lit'),380)}
function playSeq(){pzSt.show=true;pzSt.in=[];const me=pzSt;
 me.seq.forEach((v,k)=>setTimeout(()=>{if(pzSt===me){flashPad(v);sfx(300+v*130,.2,'sine',.06)}},800+k*700));
 setTimeout(()=>{if(pzSt===me){me.show=false;const h=$('pzHint');if(h)h.textContent='¡Tu turno! Repite la secuencia.';const g=$('pzProg');if(g)g.textContent='○'.repeat(me.seq.length)}},800+me.seq.length*700)}
function pzMsg(t){const m=$('pzMsg');if(m)m.textContent=t}
function pzBad(){pzSt.wrong++;pzSt.in=[];pzMsg('✖ Incorrecto');sfx(120,.3,'sawtooth',.06);
 if(pzSt.wrong%3===0){alarm();toast('🚨 ¡Fallaste 3 veces y saltó la alarma!',3000)}
 if(playing&&pzSt&&pzSt.st.t==='memory')setTimeout(()=>{if(pzSt)playSeq()},900);
 if(playing&&pzSt&&pzSt.st.t==='order'){const g=$('pzProg');if(g)g.textContent=''}}
function pzGood(){sfx(880,.15,'square',.06,1320);vault.stage++;
 if(vault.stage<vault.stages.length){openPuzzle();return}
 vault.open=true;hasGem=true;closePz();sfx(660,.2,'square',.06,1320);setTimeout(()=>sfx(990,.4,'square',.06),200);
 toast('💎 ¡Tienes el diamante! Vuelve a la ENTRADA para escapar. ¡La seguridad se aceleró!',6000)}
function pzAction(a,i){if(!pzSt)return;const st=pzSt.st;
 if(a==='x'){closePz();return}
 if(a==='u'||a==='d'){pzSt.d[i]=(pzSt.d[i]+(a==='u'?1:9))%10;renderPz();return}
 if(a==='ok'){if(pzSt.d.join('')===st.sol.join(''))pzGood();else{pzBad();if(pzSt)renderPz(),pzMsg('✖ Código incorrecto')}return}
 if(a==='p'){if(st.t==='memory'&&pzSt.show)return;flashPad(i);sfx(300+i*130,.15,'sine',.06);pzSt.in.push(i);
  const sol=st.t==='order'?st.sol:pzSt.seq,k=pzSt.in.length-1;
  if(pzSt.in[k]!==sol[k]){pzBad();return}
  const g=$('pzProg');if(g)g.textContent='●'.repeat(pzSt.in.length)+'○'.repeat(sol.length-pzSt.in.length);
  if(pzSt.in.length===sol.length)pzGood()}}
$('pz').addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(b)pzAction(b.dataset.a,+b.dataset.i)});
const VIG=(()=>{const g=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.5)');return g})();
function followCam(dt,snap){const py=p.cl?p.y:FY[p.f],tx=Math.max(0,Math.min(WW-W,p.x-W/2)),ty=Math.max(0,Math.min(FY[FY.length-1]+24-H,py-340));
 if(snap){camX=tx;camY=ty}else{const k=Math.min(1,dt*7);camX+=(tx-camX)*k;camY+=(ty-camY)*k}}
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(playing){if(!paused&&!puz)update(dt);draw();banner()}else{sceneT+=dt;drawScene(dt)}
 cv.style.transform=playing&&flash>.2?`translate(${(Math.random()-.5)*flash*8}px,${(Math.random()-.5)*flash*8}px)`:''
 requestAnimationFrame(loop);
}
requestAnimationFrame(t=>{last=t;loop(t)});
</script></body></html>
